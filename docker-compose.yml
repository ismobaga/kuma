version: '3.8'

# Minimal resource configuration for resource-limited environments
# Good for: 1 GB RAM servers, low-power devices, Bamako context

services:
  yan-kuma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yan-kuma-app
    ports:
      - "8080:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./yan_kuma.db:/app/yan_kuma.db
    environment:
      - UPLOAD_DIR=/app/uploads
      - PORT=8000
      - MAX_STORAGE_MB=250
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_USER=${GITHUB_USER}
      - GITHUB_EMAIL=${GITHUB_EMAIL}
      - HF_TOKEN=${HF_TOKEN}
      - HF_REPO_ID=${HF_REPO_ID}
      - ASR_MODEL=${ASR_MODEL:-facebook/wav2vec2-large-xlsr-53-bambara}
      - YOUTUBE_COOKIES_FILE=${YOUTUBE_COOKIES_FILE:-./cookies.txt}
      - YOUTUBE_COOKIES_CONTENT=${YOUTUBE_COOKIES_CONTENT}

      # Skip ASR for minimal memory footprint
      # ASR_MODEL would add ~2 GB to memory usage
    deploy:
      resources:
        limits:
          cpus: '1'    # Half a core max
          memory: 1G     # 1 GB max
        reservations:
          cpus: '1'   # 0.25 core reserved
          memory: 512M   # 512 MB reserved
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s


volumes:
  uploads:
  database: